<svg xmlns="http://www.w3.org/2000/svg" width="660" height="352" viewBox="0 0 660 352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <clipPath id="reveal">
    <rect x="0" y="0" width="660" height="44">
      <animate attributeName="height" calcMode="discrete" values="44;68;90;112;134;156;178;200;222;244;266;288;310;332;332" keyTimes="0.0;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;1.0" dur="9.35s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <rect width="660" height="352" rx="10" fill="#1e1e2e"/>
  <rect width="660" height="34" rx="10" fill="#181825"/>
  <rect y="24" width="660" height="10" fill="#181825"/>
  <circle cx="18" cy="17" r="6" fill="#f38ba8"/><circle cx="36" cy="17" r="6" fill="#f9e2af"/><circle cx="54" cy="17" r="6" fill="#a6e22e"/>
  <text x="330" y="21" fill="#6c7086" text-anchor="middle" font-size="12">quicksave - demo</text>
  <g clip-path="url(#reveal)">
    <text x="18.0" y="64" fill="#a6e22e" xml:space="preserve">$ </text><text x="34.8" y="64" fill="#cdd6f4" xml:space="preserve">quicksave init</text><text x="18.0" y="86" fill="#6c7086" xml:space="preserve">initialized quicksave in /tmp/demo</text><text x="18.0" y="130" fill="#a6e22e" xml:space="preserve">$ </text><text x="34.8" y="130" fill="#cdd6f4" xml:space="preserve">quicksave save -n pre-agent</text><text x="18.0" y="152" fill="#94e2d5" xml:space="preserve">saved 98c66e6a pre-agent </text><text x="228.0" y="152" fill="#6c7086" xml:space="preserve">(3 files)</text><text x="18.0" y="196" fill="#a6e22e" xml:space="preserve">$ </text><text x="34.8" y="196" fill="#cdd6f4" xml:space="preserve">rm -rf src .env  </text><text x="177.6" y="196" fill="#6c7086" xml:space="preserve"># the agent wipes untracked files</text><text x="18.0" y="240" fill="#a6e22e" xml:space="preserve">$ </text><text x="34.8" y="240" fill="#cdd6f4" xml:space="preserve">quicksave restore pre-agent --clean</text><text x="18.0" y="262" fill="#94e2d5" xml:space="preserve">restored 3 files from pre-agent</text><text x="18.0" y="306" fill="#a6e22e" xml:space="preserve">$ </text><text x="34.8" y="306" fill="#cdd6f4" xml:space="preserve">ls src</text><text x="18.0" y="328" fill="#cdd6f4" xml:space="preserve">app.py  </text><text x="85.2" y="328" fill="#6c7086" xml:space="preserve"># back from the dead</text>
  </g>
</svg>
