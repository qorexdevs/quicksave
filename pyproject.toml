# pypi name is quicksave-fs because plain "quicksave" is taken; the command stays `quicksave`
[project]
name = "quicksave-fs"
version = "0.20.0"
description = "F5 for your filesystem: checkpoint before every agent command, restore even after rm -rf"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]
keywords = ["snapshot", "checkpoint", "undo", "agent", "filesystem", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
quicksave = "quicksave.cli:main"

[project.urls]
Homepage = "https://github.com/qorexdevs/quicksave"
Issues = "https://github.com/qorexdevs/quicksave/issues"
Changelog = "https://github.com/qorexdevs/quicksave/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quicksave"]
